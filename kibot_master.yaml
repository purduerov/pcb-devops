kibot:
  version: 1

preflight:
  run_erc: true
  run_drc: true
  check_zone_fills: true

  check_fields:
    - field: 'MPN'
      severity: error
    - field: 'DigiKey'
      severity: error

outputs:
  - name: 'schematic_pdf'
    comment: 'Export schematic to PDF'
    type: pdf_sch_print
    options:
      output: '%f-Schematic.pdf'

  - name: 'board_layout_pdf'
    comment: 'Export PCB layout to PDF'
    type: pcb_print
    options:
      output: '%f-Layout.pdf'

  - name: 'interactive_bom'
    comment: 'Generate Interactive HTML BOM'
    type: ibom
    options:
      output: '%f-iBOM.html'

  - name: 'bom_csv'
    comment: 'Bill of Materials in CSV format'
    type: bom
    options:
      format: CSV
      output: '%f-BOM.csv'

  - name: 'bom_xml'
    comment: 'Bill of Materials in XML format for sourcing validation'
    type: bom
    options:
      format: XML
      output: '%f-BOM.xml'

name: Central KiCad CI

on:
  workflow_call:
    inputs:
      strict_drc:
        description: 'Enforce strict DRC/ERC validation'
        required: false
        type: boolean
        default: false
      enable_sourcing_check:
        description: 'Run DigiKey/Mouser BOM stock and lifecycle checks'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kicad-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:

      - name: Checkout Board Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Fetch all history for branch comparisons

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve Platform Ref
        id: platform_ref
        # rov.project.json is the single source of truth for which purduerov/pcb-devops
        # revision validates this board. Reading it here is what makes platform_ref
        # operational instead of documentation, and failing closed is deliberate: a board
        # with no usable ref must not be validated by an arbitrary revision. It runs after
        # Setup Python so the manifest is read with a known interpreter.
        run: |
          set -euo pipefail
          MANIFEST="rov.project.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST is missing, so the platform ref for purduerov/pcb-devops is unknown. Add the manifest before running this workflow."
            exit 1
          fi
          REF=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('platform_ref') or '')" "$MANIFEST" | tr -d '\r')
          if [ -z "$REF" ]; then
            echo "::error::platform_ref is missing or empty in $MANIFEST, so the platform ref for purduerov/pcb-devops is unknown. Set it to the branch, tag, or commit that should validate this board."
            exit 1
          fi
          case "$REF" in
            /*|*/|*..*)
              echo "::error::platform_ref '$REF' in $MANIFEST is not a valid ref. It may not start or end with '/' and may not contain '..'."
              exit 1
              ;;
            *[!A-Za-z0-9._/-]*)
              echo "::error::platform_ref '$REF' in $MANIFEST is not a valid ref. Use only letters, digits, '.', '_', '-', and '/'."
              exit 1
              ;;
          esac
          echo "Validating this board with purduerov/pcb-devops at $REF (from $MANIFEST)."
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout DevOps Tools
        uses: actions/checkout@v4
        with:
          repository: purduerov/pcb-devops
          ref: ${{ steps.platform_ref.outputs.ref }}
          # actions/checkout only accepts a path under the workspace, so the
          # tools cannot be cloned outside the board tree. The next step hides
          # the directory from Git, so the checkout is not an untracked change
          # in the board being validated and exported.
          path: pcb-devops-tools

      - name: Keep the Tools Checkout Out of the Board Repository's Status
        run: |
          # `.git/info/exclude` is local to the runner, so this hides the tools
          # directory without adding a CI-only entry to the board's committed
          # .gitignore. Without it the board looks dirty, which the library
          # update workflow then refuses to touch.
          echo "/pcb-devops-tools/" >> .git/info/exclude

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml defusedxml

      - name: Verify No Merge Conflict Markers
        run: |
          echo "Scanning for unresolved Git merge conflict markers in design files..."
          if grep -rn -E '^(<{7}|={7}|>{7})' --include='*.kicad_*' --include='*-lib-table' . ; then
            echo "❌ ERROR: Unresolved Git merge conflict markers found in project files!"
            exit 1
          fi
          echo "✅ No conflict markers found."

      - name: Verify Central Library Submodule
        run: |
          if [ -d "libs/purdue-rov-kicad-lib" ]; then
            if [ ! -f "libs/purdue-rov-kicad-lib/Symbols/rov_connectors.kicad_sym" ]; then
              echo "❌ ERROR: Submodule libs/purdue-rov-kicad-lib is uninitialized or empty!"
              exit 1
            fi
            echo "✅ Submodule libs/purdue-rov-kicad-lib initialized correctly."
          fi

      - name: Run Shared ROV Board Validation
        # This step is the single owner of the library symbol lint as well as the
        # manifest, project-file, library-table, submodule, and conflict-marker
        # checks. It runs the central linter over the library's Symbols directory
        # itself, so a separate find-and-exec step over the same files would lint
        # them twice and report the same failure twice.
        run: python3 pcb-devops-tools/scripts/rov.py board validate --project-dir .

      - name: Configure KiBot Preflight Rules
        run: |
          cp pcb-devops-tools/kibot_master.yaml local_kibot.yaml
          if [ "${{ inputs.strict_drc }}" = "false" ]; then
            echo "Non-strict DRC requested. Relaxing preflight checks for WIP branch..."
            sed -i 's/run_drc: true/run_drc: false/g' local_kibot.yaml
            sed -i 's/run_erc: true/run_erc: false/g' local_kibot.yaml
            sed -i 's/severity: error/severity: warning/g' local_kibot.yaml
          fi

      - name: Resolve KiCad File Names
        id: kicad_files
        run: |
          PCB=$(ls *.kicad_pcb 2>/dev/null | head -n 1)
          if [ -n "$PCB" ]; then
            BASENAME="${PCB%.kicad_pcb}"
            if [ -f "${BASENAME}.kicad_sch" ]; then
              SCH="${BASENAME}.kicad_sch"
            else
              SCH=$(ls *.kicad_sch 2>/dev/null | head -n 1)
            fi
          else
            SCH=$(ls *.kicad_sch 2>/dev/null | head -n 1)
          fi

          if [ -z "$SCH" ] || [ -z "$PCB" ]; then
            echo "No matching .kicad_sch or .kicad_pcb file found in root. Skipping KiBot manufacturing export."
            echo "has_files=false" >> $GITHUB_OUTPUT
          else
            echo "Found schematic: $SCH"
            echo "Found board: $PCB"
            echo "has_files=true" >> $GITHUB_OUTPUT
            echo "schema=$SCH" >> $GITHUB_OUTPUT
            echo "board=$PCB"  >> $GITHUB_OUTPUT
          fi

      - name: Run ERC, DRC, and Exports
        if: steps.kicad_files.outputs.has_files == 'true'
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: local_kibot.yaml
          dir: Generated_Outputs
          schema: ${{ steps.kicad_files.outputs.schema }}
          board: ${{ steps.kicad_files.outputs.board }}

      - name: Run Component Sourcing Validation
        if: steps.kicad_files.outputs.has_files == 'true' && inputs.enable_sourcing_check == true
        env:
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
          DIGIKEY_REFRESH_TOKEN: ${{ secrets.DIGIKEY_REFRESH_TOKEN }}
          DIGIKEY_TOKEN_PATH: ${{ github.workspace }}/digikey_token.json
        run: |
          # Find the generated XML BOM and query distributor APIs
          XML_BOM=$(find Generated_Outputs -name "*.xml" | head -n 1)
          if [ -n "$XML_BOM" ] && { [ -n "$MOUSER_API_KEY" ] || [ -n "$DIGIKEY_CLIENT_ID" ]; }; then
            python3 pcb-devops-tools/scripts/fetch_sourcing_bom.py "$XML_BOM"
          else
            echo "Skipping sourcing check: XML BOM or sourcing API credentials not present."
          fi

      - name: Generate Web Portal and Job Summary
        if: steps.kicad_files.outputs.has_files == 'true'
        run: |
          sudo chown -R $USER:$USER Generated_Outputs
          python3 pcb-devops-tools/scripts/generate_portal_page.py Generated_Outputs "${{ github.repository }}" "${{ github.sha }}" "${{ github.ref_name }}"
          
          echo "## 🌊 Purdue ROV Hardware Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Description | Format |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 **Interactive BOM** | Interactive component pad highlighter for soldering | HTML |" >> $GITHUB_STEP_SUMMARY
          echo "| 📄 **Schematic** | Multi-sheet vector schematic with nets and pinouts | PDF |" >> $GITHUB_STEP_SUMMARY
          echo "| 📐 **PCB Layout** | 2D layer trace and component placement plots | PDF |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 **Parts List** | Bill of Materials with MPN & DigiKey data | CSV |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            REPO_OWNER="${{ github.repository_owner }}"
            REPO_NAME="${{ github.event.repository.name }}"
            echo "🌐 **Live GitHub Pages Portal:** [https://${REPO_OWNER}.github.io/${REPO_NAME}/](https://${REPO_OWNER}.github.io/${REPO_NAME}/)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Generated Artifacts
        if: steps.kicad_files.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: design-outputs
          path: Generated_Outputs/

      - name: Deploy Interactive BOM to GitHub Pages
        if: steps.kicad_files.outputs.has_files == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Generated_Outputs
          keep_files: false



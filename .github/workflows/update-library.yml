name: Update Board Library

# Reusable library update for board repositories. The board's rov.project.json
# is the source of truth for the library path and the update branch defaults
# below are only fallbacks. The shared CLI owns the whole operation: this
# workflow never commits to, or pushes, the base branch, and it never force
# pushes. The update is published as a reviewable pull request, and auto-merge
# stays off unless the caller explicitly opts in.
on:
  workflow_call:
    inputs:
      library-path:
        description: "Fail-closed cross-check against the library path in rov.project.json; a value that disagrees with the manifest is blocked, never applied."
        required: false
        type: string
        default: libs/purdue-rov-kicad-lib
      library-branch:
        description: Approved library branch that the board tracks.
        required: false
        type: string
        default: master
      update-branch:
        description: Reviewable branch the update is published on. Never the base branch.
        required: false
        type: string
        default: chore/library-update
      auto-merge:
        description: Enable auto-merge for the library update pull request. Opt-in only.
        required: false
        type: boolean
        default: false
      platform-ref:
        description: Branch of purduerov/pcb-devops that provides the shared CLI.
        required: false
        type: string
        default: master

jobs:
  update-library:
    name: Prepare library update pull request
    runs-on: ubuntu-latest
    # Least privilege: the job may only publish the update branch and open the
    # pull request. It cannot administer the repository.
    permissions:
      contents: write
      pull-requests: write
    # One update per repository and update branch at a time. The group is keyed
    # on the branch the update lands on, not on the caller's ref, so two calls
    # for the same branch queue instead of racing, and a queued run is never
    # cancelled mid-push.
    concurrency:
      group: library-update-${{ github.repository }}-${{ inputs.update-branch }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.update.outputs.url }}
      state: ${{ steps.update.outputs.state }}
    steps:
      - name: Checkout Board
        uses: actions/checkout@v4
        with:
          # The full history and the initialized library submodule are required
          # to plan and apply the update safely.
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Platform Tools
        uses: actions/checkout@v4
        with:
          repository: purduerov/pcb-devops
          ref: ${{ inputs.platform-ref }}
          # actions/checkout only accepts a path under the workspace, so the
          # tools cannot be cloned outside the board tree. The next step hides
          # the directory from Git instead, which is what keeps the board
          # clean enough for the CLI to update it.
          path: pcb-devops-tools

      - name: Keep the Tools Checkout Out of the Board Repository's Status
        run: |
          # A tools checkout inside the board is an untracked change, and the
          # CLI refuses to update a board that has uncommitted changes, so the
          # workflow would block its own update. `.git/info/exclude` is local to
          # the runner, so this hides the directory without adding a CI-only
          # entry to the board's committed .gitignore.
          echo "/pcb-devops-tools/" >> .git/info/exclude
          git status --porcelain

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Bot Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preflight Update Branch and Pull Request
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.ORG_UPDATE_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ORG_UPDATE_TOKEN: ${{ secrets.ORG_UPDATE_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          # The update branch is shared and long-lived: the next scheduled run
          # reuses it, and the CLI refuses to push when the remote branch already
          # holds a different commit. That refusal is correct, but on its own it
          # reads like an unexplained weekly failure. This step only *reports*
          # the reuse state so a human can see whether a stale branch or an open
          # pull request is what blocked the run.
          #
          # It deliberately changes nothing: nothing is force pushed, no branch
          # is deleted, and no pull request is closed or reopened, so a
          # reviewer's work is never discarded and no unrelated review is
          # ended. Instead the repository has to be configured to
          # delete head branches automatically after merge, or a human removes
          # the merged update branch. That requirement is documented in
          # README.md under "The scheduled update branch".
          set -uo pipefail
          BRANCH="${{ inputs.update-branch }}"

          # A pull request opened with the default GITHUB_TOKEN is authored by
          # the github-actions app, and the board's own pull_request CI then sits
          # at "action_required" until a human approves the run. The update
          # branch is therefore pushed and its pull request opened with
          # ORG_UPDATE_TOKEN or PAT_TOKEN when one is configured, so the gate
          # runs on its own. Without either secret the update still opens, but
          # the person merging it has to approve the workflow run first.
          if [ -z "$ORG_UPDATE_TOKEN" ] && [ -z "$PAT_TOKEN" ]; then
            echo "::warning::Neither ORG_UPDATE_TOKEN nor PAT_TOKEN is configured, so this run falls back to GITHUB_TOKEN. The pull request will be authored by github-actions and the board's CI on it will need manual approval before it runs. Add ORG_UPDATE_TOKEN (contents: write, pull-requests: write) to the board repository to make that gate automatic." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "## Library update preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Update branch: \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Approved library branch: \`${{ inputs.library-branch }}\`" >> "$GITHUB_STEP_SUMMARY"

          if REMOTE_COMMIT=$(git ls-remote --heads origin "$BRANCH" 2>/dev/null | awk '{print $1}') && [ -n "$REMOTE_COMMIT" ]; then
            echo "- Remote branch: \`origin/$BRANCH\` already exists at \`$REMOTE_COMMIT\` and will be reused." >> "$GITHUB_STEP_SUMMARY"
            echo "Reusing existing origin/$BRANCH at $REMOTE_COMMIT."
          else
            echo "- Remote branch: \`origin/$BRANCH\` does not exist yet and will be created." >> "$GITHUB_STEP_SUMMARY"
            echo "origin/$BRANCH does not exist yet; it will be created."
          fi

          if OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number,url \
            --limit 1 2>/dev/null) && [ -n "$OPEN_PR" ] && [ "$OPEN_PR" != "[]" ]; then
            echo "- Open pull request for this branch:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            gh pr list --head "$BRANCH" --state open --json number,url,title --limit 5 \
              --jq '.[] | "  - #\(.number) \(.title) (\(.url))"' >> "$GITHUB_STEP_SUMMARY" || true
            echo "An open pull request for $BRANCH is still in review; this run reuses it instead of opening a second one."
          else
            echo "- Open pull request for this branch: none." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The update branch is bot-owned and reused every run. If \`origin/$BRANCH\` exists but does not hold the commit this run prepared, the CLI stops rather than pushing over it: merge the open pull request, then let the repository delete the head branch (or delete it yourself), and re-run." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Library Update Pull Request
        id: update
        env:
          GH_TOKEN: ${{ secrets.ORG_UPDATE_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The shared CLI plans the update, commits the submodule pointer on the
          # update branch, pushes only that branch, and then runs
          # `gh pr create` for it. A FAIL or BLOCKED state stops this step.
          UPDATE_STATUS=0
          PR_OUTPUT=$(python pcb-devops-tools/scripts/rov.py board sync-library \
            --project-dir . \
            --library-path "${{ inputs.library-path }}" \
            --library-branch "${{ inputs.library-branch }}" \
            --branch "${{ inputs.update-branch }}" \
            --commit-message "chore(library): update Purdue ROV component library" \
            --apply --push --pr 2>&1) || UPDATE_STATUS=$?
          printf '%s\n' "$PR_OUTPUT"

          if [ "$UPDATE_STATUS" -ne 0 ]; then
            echo "::error::The library update did not complete. See the report above."
            exit "$UPDATE_STATUS"
          fi

          # The CLI's contract is a single marker line, and only that line is
          # read here: `PR_URL=<url>` when an update pull request is open for the
          # update branch, `NO_CHANGE` when the board already records the
          # approved revision. The human report above is printed for the run log
          # and is never parsed, so rewording it cannot change the outcome.
          if printf '%s\n' "$PR_OUTPUT" | grep -qx 'NO_CHANGE'; then
            echo "The board already uses the approved library revision (NO_CHANGE)."
            echo "state=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_URL=$(printf '%s\n' "$PR_OUTPUT" | sed -n 's|^PR_URL=||p' | tail -n 1)
          case "$PR_URL" in
            https://*) ;;
            *)
              echo "::error::The CLI reported neither PR_URL= nor NO_CHANGE. See the report above."
              exit 1
              ;;
          esac

          echo "Prepared $PR_URL"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "state=updated" >> "$GITHUB_OUTPUT"

      - name: Enable Auto Merge
        if: ${{ inputs.auto-merge && steps.update.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ secrets.ORG_UPDATE_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh pr merge --auto --merge "${{ steps.update.outputs.url }}"

name: DevOps Tools Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# The validation job only reads the repository, compiles, and runs tests.
permissions:
  contents: read

jobs:
  validate-tools:
    # The shared CLI is the entry point on Windows, Linux, and macOS, so the
    # same fast checks run everywhere a member is expected to work.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml defusedxml

      - name: Compile Python Scripts
        run: |
          python -m py_compile scripts/rov.py scripts/rov_core.py scripts/fetch_sourcing_bom.py scripts/linter_validator.py scripts/generate_portal_page.py scripts/sync_project_libs.py

      - name: Validate YAML Syntax
        run: |
          python -c "import yaml; yaml.safe_load(open('kibot_master.yaml'))"

      - name: Validate Workflow Syntax
        run: |
          python -c "import pathlib, yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('.github/workflows').glob('*.yml')]"

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v
